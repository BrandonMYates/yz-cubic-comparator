related_formalizations:
- id: https://github.com/leanprover-community/mathlib4
  relationship: independent
  note: Mathlib supplies everything the statement needs -- Polynomial, Polynomial.comp,
    natDegree -- so the Challenge introduces no definitions. The proof uses Mathlib's
    fermatLastTheoremThree (Fermat's Last Theorem for exponent three) for the degree-3
    window, and otherwise only elementary polynomial algebra; no Groebner-basis or
    ideal-membership computation is replayed or relied upon.
status:
  scope: 'PROVED: no triple of rational polynomials (g, u, v) with 1 <= deg g <= 4
    satisfies u*v*(u+v) = f composed with g, where f = X^3 + X^2 + 3X - 1. NOT PROVED
    and NOT CLAIMED: any statement about the existence of integer or rational solutions
    of y*z*(y+z) = x^3 + x^2 + 3x - 1; the case deg g >= 5; and every other result in
    the author''s working notes on this equation, none of which is advertised here.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - claude-opus-5
    - claude-fable-5
    framework: Claude Code
    tool_setup: The mathematics of the exclusion argument was worked out by Claude
      Code agents under the author's direction during July 2026. The Lean statement
      was written by a Claude Code agent in August 2026. The Lean proof (the pinned
      YZCubic library) was produced on 2026-08-26 by a lead agent (claude-opus-5)
      coordinating four worker agents (claude-opus-5) against frozen lemma contracts,
      with independent re-verification (builds, axiom audits, statement diffs) by a
      separate agent (claude-fable-5) under the author's direction.
    cost:
      wall_time: about one hour of wall-clock for the Lean library, concurrent agents
      spend_usd: subscription-based
      hardware: local Apple Silicon machine
    prompting_notes: 'Two items on record. (1) The planned route for the degree-3
      window was an ideal-membership certificate for a zero-dimensional system of
      degree 102 in seven variables; during construction the lead agent observed that
      the window reduces, by comparing leading coefficients, to A*B*(A+B) = G^3 in
      nonzero rationals -- Fermat''s Last Theorem for exponent three -- so the
      certificate was never needed and no computer-algebra elimination enters the
      proof. (2) That degree-102 system had earlier been recomputed independently on
      2026-08-26 in a second computer-algebra system, confirming the original
      exploratory claim; it is recorded for provenance only and the compared theorem
      does not depend on it.'
  spend_usd: subscription-based
  notes: 'Roles, stated separately. Direction: the author selected the problem (the
    smallest open cubic on the MathOverflow list), set the target statement and its
    scope, directed the work at every stage, and takes responsibility for the
    submission. Mathematical argument: developed by AI agents (Claude Code,
    claude-opus-5) under that direction, not by the author -- the structural lemmas
    (degree divisibility, slot-degree windows, the square-completion exclusion) were
    identified in a July 2026 agent-run computational search, and the decisive
    reduction of the degree-3 window to Fermat''s Last Theorem for exponent three was
    found by the lead agent during formalization; the author did not devise the proof
    steps. Formalization: the same agents, against frozen lemma contracts.
    Verification: mechanical (Lean, the axiom audit, Comparator) plus an independent
    re-verification pass by a separate agent (claude-fable-5): clean rebuild, per-theorem
    axiom audit, statement diff, rfl bridge. Communication: the Challenge
    documentation, this metadata and the library README were drafted by agents and
    reviewed by the author before submission.'
fidelity:
  divergences: 'The compared theorem quantifies over polynomials with rational coefficients.
    The underlying question is about integer solutions; the polynomial-family statement
    over the rationals is strictly stronger than the same statement over the integers,
    and no integrality hypothesis is imposed. The degree bound in the formal statement
    is exactly the bound proved: degree 5 is excluded from the statement rather than
    silently assumed away. No other known divergence.'
review:
  status: agent-reviewed
  reviewers:
  - Claude Code agents (independent clean rebuild, axiom audit, statement diff, rfl bridge)
  notes: 'Reviewed internally, mechanically: the pinned library was rebuilt from a clean
    checkout against Mathlib v4.32.0; every public theorem was checked with #print
    axioms to depend on exactly propext, Classical.choice and Quot.sound; a
    comment-stripped scan found no sorry, native_decide or axiom declarations; the
    Challenge statement was diffed against the library theorem and the definitional
    bridge (X^3 + X^2 + 3X - 1 = YZCubic.fq, by rfl) was compiled in a separate file
    against the built artifacts. No human expert has reviewed the mathematics.'
alignment:
  namespace: SmallestOpenCubic
  statements:
  - source: The author's working notes, the assertion that the equation admits no
      polynomial parametrization over the rationals with deg x(t) <= 4
    lean: SmallestOpenCubic.no_polynomial_family_deg_le_four
    module: Challenge
    status: proved
    note: 'The Lean statement renders "polynomial parametrization (x, y, z) = (g(t),
      u(t), v(t))" as the polynomial identity u*v*(u+v) = f.comp g in Polynomial
      Q, with g nonconstant. Constant g is excluded by hypothesis: it corresponds
      to a single rational point rather than a family, and carries no information
      about solvability.'
