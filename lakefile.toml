name = "YZCubicComparator"
defaultTargets = ["Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

# The proof development. Palomar requires a credential-free public URL and a full
# 40-char lowercase SHA.
[[require]]
name = "YZCubic"
git = "https://github.com/BrandonMYates/yzcubic.git"
rev = "0c0b444244b4d1d1d551418676375fdc7f70b58e"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
